<div class="flex min-h-screen items-center justify-center bg-background px-4 py-10">
  <div class="w-full max-w-md">
    <!-- Brand -->
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="mb-5 flex size-16 items-center justify-center rounded-2xl bg-primary text-primary-foreground shadow-sm">
        <ng-icon name="lucideMusic" size="30" />
      </span>
      <h1 class="font-display text-3xl font-extrabold tracking-tight">{{ 'LOGIN.TITLE' | translate }}</h1>
      <p class="mt-2 text-sm text-muted-foreground">{{ 'LOGIN.TAGLINE' | translate }}</p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border bg-card p-6 shadow-sm sm:p-8">
      <div class="grid gap-3 sm:grid-cols-2">
        @for (feature of features; track feature.title) {
          <div class="rounded-xl border bg-background/40 p-4">
            <span class="mb-3 flex size-9 items-center justify-center rounded-lg bg-primary/10 text-primary">
              <ng-icon [name]="feature.icon" size="18" />
            </span>
            <h2 class="text-sm font-semibold">{{ feature.title | translate }}</h2>
            <p class="mt-1 text-xs leading-relaxed text-muted-foreground">{{ feature.desc | translate }}</p>
          </div>
        }
      </div>

      <button
        type="button"
        (click)="loginWithSpotify()"
        class="mt-6 flex h-12 w-full items-center justify-center gap-2.5 rounded-full bg-[#1db954] font-display text-sm font-semibold text-white shadow-sm transition-all hover:bg-[#1ed760] hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1db954] focus-visible:ring-offset-2 focus-visible:ring-offset-background"
      >
        <svg viewBox="0 0 24 24" class="size-5" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.3c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.38-.48.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14 4.38-1.32 9.78-.66 13.5 1.62.36.18.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.1 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.32-1.32 11.4-1.02 15.9 1.62.54.3.72 1.02.42 1.56-.3.48-1.02.66-1.56.36z"/>
        </svg>
        {{ 'LOGIN.CONTINUE_SPOTIFY' | translate }}
      </button>

      <div class="mt-4 flex items-start gap-2 text-xs text-muted-foreground">
        <ng-icon name="lucideShieldCheck" size="15" class="mt-0.5 shrink-0" />
        <span>{{ 'LOGIN.DISCLAIMER' | translate }}</span>
      </div>
    </div>
  </div>
</div>
